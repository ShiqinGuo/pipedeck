[package]
name = "pipedeck-desktop"
version = "0.1.0"
description = "Pipedeck desktop shell"
authors = ["Pipedeck Engineering"]
edition = "2021"

[lib]
name = "pipedeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-shell = "2"
uuid = { version = "1.24", features = ["v4"] }
