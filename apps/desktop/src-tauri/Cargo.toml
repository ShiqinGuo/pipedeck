[package]
name = "pipedeck-desktop"
version = "0.2.0"
description = "Pipedeck desktop shell"
authors = ["Pipedeck Engineering"]
edition = "2021"

[lib]
name = "pipedeck_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
uuid = { version = "1.24", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
