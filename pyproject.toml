[project]
name = "tripguru-local"
version = "0.1.0"
description = "Local-only TripGuru multi-project development control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
tripguru-local-api = "tripguru_local.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyinstaller>=6.15.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tripguru_local"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
