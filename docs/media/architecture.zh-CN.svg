<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Pipedeck / 技术架构</title><desc id="desc">One local control API owns configuration and history; runtime state is observed separately. Local integration only. Open the application after readiness checks to verify real business behavior.</desc>
